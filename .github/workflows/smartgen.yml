name: Frontend Only CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rinovabd-frontend
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy Static Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Path Fixer
        run: python fix_paths.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Frontend Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
